services:
  artifact-server:
    build:
      # docker buildx bake --push
      context: .
      dockerfile: Dockerfile
      tags:
        - davbfr/artifact:latest
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    image: davbfr/artifact:latest
    container_name: artifact-server
    volumes:
      - ./data:/var/uploads
    environment:
      - ART_API_TOKEN
      - ART_APPEND_ONLY
      - ART_MAX_FILE_SIZE
      - ART_MAX_LIST_LIMIT
      - ART_NO_FILENAME_URL
      - ART_NO_LISTING
      - ART_WEB_PORTAL
      - ART_SESSION_SECRET
      - ART_SESSION_TTL
      - ART_OIDC_ISSUER
      - ART_OIDC_CLIENT_ID
      - ART_OIDC_CLIENT_SECRET
      - ART_OIDC_SCOPES
      - ART_OIDC_REDIRECT_URL
      - ART_OIDC_GROUPS_CLAIM
      - ART_OIDC_GROUPS
      - ART_ROLES
      - ART_STORAGE
      - ART_S3_BUCKET
      - ART_S3_PREFIX
      - ART_S3_REGION
      - ART_S3_ENDPOINT
      - ART_S3_PATH_STYLE
      - ART_READ_ONLY
      - ART_DB_REPLICA
      - ART_DB_RESTORE
      - ART_DB_BACKUP_DELAY
      - ART_DB_BACKUP_PREFIX
      - ART_DB_POLL_INTERVAL
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
    restart: unless-stopped
    ports:
      - "9080:8080"
    develop:
      watch:
        - action: rebuild
          path: ./server
          ignore:
            - server/tmp/
        - action: rebuild
          path: ./web
          ignore:
            - web/.dart_tool/
            - web/build/
        - action: rebuild
          path: ./Dockerfile
