services:
  artifact-server:
    build:
      # docker buildx bake --push
      context: .
      dockerfile: Dockerfile
      tags:
        - davbfr/artifact:latest
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    image: davbfr/artifact:latest
    container_name: artifact-server
    volumes:
      - ./data:/var/uploads
    environment:
      - ART_API_TOKEN
      - ART_APPEND_ONLY
      - ART_MAX_FILE_SIZE
      - ART_MAX_LIST_LIMIT
      - ART_NO_FILENAME_URL
      - ART_NO_LISTING
      - ART_WEB_PORTAL
      - ART_SESSION_SECRET
      - ART_SESSION_TTL
      - ART_OIDC_ISSUER
      - ART_OIDC_CLIENT_ID
      - ART_OIDC_CLIENT_SECRET
      - ART_OIDC_SCOPES
      - ART_OIDC_REDIRECT_URL
    restart: unless-stopped
    ports:
      - "9080:8080"
    develop:
      watch:
        - action: rebuild
          path: ./server
          ignore:
            - server/tmp/
        - action: rebuild
          path: ./web
          ignore:
            - web/.dart_tool/
            - web/build/
        - action: rebuild
          path: ./Dockerfile
