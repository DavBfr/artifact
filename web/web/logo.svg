<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" opacity="0.1"/>
  
  <!-- Main archive box -->
  <g transform="translate(100, 100)">
    <!-- Box back panel -->
    <path d="M -40 -25 L -40 35 L 40 35 L 40 -25 Z" 
          fill="url(#gradient1)" 
          opacity="0.8"/>
    
    <!-- Box front panel -->
    <path d="M -45 -30 L -45 30 L 45 30 L 45 -30 Z" 
          fill="url(#gradient1)"/>
    
    <!-- Box lid -->
    <path d="M -48 -30 L -45 -35 L 45 -35 L 48 -30 Z" 
          fill="url(#gradient2)"/>
    
    <!-- Archive lines decoration -->
    <line x1="-35" y1="-15" x2="35" y2="-15" 
          stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-35" y1="-5" x2="35" y2="-5" 
          stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-35" y1="5" x2="35" y2="5" 
          stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-35" y1="15" x2="20" y2="15" 
          stroke="white" stroke-width="2" opacity="0.6"/>
    
    <!-- Upload arrow -->
    <g transform="translate(0, -55)">
      <!-- Arrow shaft -->
      <rect x="-3" y="0" width="6" height="25" 
            fill="url(#gradient2)" rx="3"/>
      <!-- Arrow head -->
      <path d="M -12 15 L 0 0 L 12 15 Z" 
            fill="url(#gradient2)"/>
    </g>
    
    <!-- Cloud dots for upload -->
    <circle cx="-25" cy="-50" r="3" fill="url(#gradient2)" opacity="0.7"/>
    <circle cx="25" cy="-50" r="3" fill="url(#gradient2)" opacity="0.7"/>
    <circle cx="-15" cy="-58" r="2.5" fill="url(#gradient2)" opacity="0.5"/>
    <circle cx="15" cy="-58" r="2.5" fill="url(#gradient2)" opacity="0.5"/>
  </g>
  
  <!-- Optional: Add text below -->
  <text x="100" y="170" 
        font-family="Arial, sans-serif" 
        font-size="18" 
        font-weight="bold" 
        fill="url(#gradient1)" 
        text-anchor="middle">ARTIFACT</text>
</svg>
