name: artifact_web
description: Artifact Server Web UI built with Jaspr
version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  http: ^1.5.0
  jaspr: ^0.21.6
  json_annotation: ^4.9.0
  json_serializable: ^6.11.1
  universal_web: ^1.1.1+1

dev_dependencies:
  build_runner: ^2.6.0
  build_web_compilers: ^4.4.1
  flutter_lints: ^6.0.0
  jaspr_builder: ^0.21.6
  jaspr_cli: ^0.21.6
  jaspr_lints: ^0.5.1

jaspr:
  mode: client
