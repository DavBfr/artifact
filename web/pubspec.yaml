name: artifact_web
description: Artifact Server Web UI built with Jaspr
version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  deepyr: ^0.3.0
  http: ^1.5.0
  jaspr: ^0.21.6
  jaspr_router: ^0.7.3
  json_annotation: ^4.9.0
  json_serializable: ^6.11.1

dev_dependencies:
  build_runner: ^2.6.0
  build_web_compilers: ^4.4.1
  jaspr_builder: ^0.21.6
  jaspr_cli: ^0.21.6
  jaspr_lints: ^0.5.1
  lints: ^5.0.0

jaspr:
  mode: static
