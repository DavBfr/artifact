name: artifact_web
description: Artifact Server Web UI built with Jaspr
version: 1.0.0

environment:
  sdk: ^3.14.0

dependencies:
  http: ^1.5.0
  jaspr: ^0.24.0-beta.2
  json_annotation: ^4.12.0
  json_serializable: ^6.14.1
  universal_web: ^1.1.1+1

dev_dependencies:
  build_runner: ^2.6.0
  build_web_compilers: ^4.8.12
  flutter_lints: ^6.0.0
  jaspr_builder: ^0.24.0-beta.2
  jaspr_cli: ^0.24.0-beta.2
  jaspr_lints: ^0.8.0-beta.0

jaspr:
  mode: client
