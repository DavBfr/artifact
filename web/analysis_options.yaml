include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  exclude:
    - "**/*.g.dart"
  errors:
    always_declare_return_types: error
    await_only_futures: error
    directives_ordering: warning
    file_names: error
    prefer_final_fields: error
    prefer_relative_imports: warning
    prefer_single_quotes: error
    prefer_typing_uninitialized_variables: error
    unawaited_futures: warning
    unnecessary_parenthesis: error
    use_function_type_syntax_for_parameters: warning

plugins:
  jaspr_lints:
    diagnostics:
      sort_children_last: true
      prefer_html_components: true
      styles_ordering: true

custom_lint:
  rules:
    prefer_html_methods: true
    sort_children_properties_last: true
    styles_ordering: true
    prefer_styles_getter: true

linter:
  rules:
    - always_declare_return_types
    - avoid_redundant_argument_values
    - avoid_void_async
    - await_only_futures
    - cast_nullable_to_non_nullable
    - directives_ordering
    - file_names
    - leading_newlines_in_multiline_strings
    - no_default_cases
    - omit_local_variable_types
    - parameter_assignments
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_constructors_over_static_methods
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_foreach
    - prefer_generic_function_type_aliases
    - prefer_if_null_operators
    - prefer_interpolation_to_compose_strings
    - prefer_null_aware_operators
    - prefer_relative_imports
    - prefer_single_quotes
    - prefer_typing_uninitialized_variables
    - sort_constructors_first
    - sort_pub_dependencies
    - sort_unnamed_constructors_first
    - unawaited_futures
    - unnecessary_brace_in_string_interps
    - unnecessary_const
    - unnecessary_getters_setters
    - unnecessary_lambdas
    - unnecessary_null_checks
    - unnecessary_nullable_for_final_variable_declarations
    - unnecessary_overrides
    - unnecessary_parenthesis
    - unnecessary_this
    - use_build_context_synchronously
    - use_function_type_syntax_for_parameters
    - use_late_for_private_fields_and_variables
    - use_named_constants
    - void_checks
